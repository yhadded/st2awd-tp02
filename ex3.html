<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TP02 · Ex3 — Caméra orbitale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/components.js"></script>
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>
  <a class="back" href="./">← TP02</a>
  <div class="hud">
    Orbite : <b>clic gauche + glisser</b> · Zoom : <b>molette</b> (3 → 20 m) · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> déplacer (axes du monde) · <kbd>Espace</kbd> sauter<br>
    <span class="stat" id="stat"></span>
  </div>

  <a-scene renderer="antialias: true; anisotropy: 8" shadow="type: pcfsoft">
    <a-assets>
      <img id="grass" src="assets/grass.jpg">
      <img id="sky" src="assets/sky.jpg">
    </a-assets>

    <a-plane rotation="-90 0 0" width="200" height="200"
             material="src: #grass; repeat: 50 50; roughness: 1" shadow="cast: false; receive: true"></a-plane>
    <a-sky src="#sky"></a-sky>
    <a-entity scenery></a-entity>

    <a-entity light="type: ambient; intensity: 0.55"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                     shadowCameraLeft: -30; shadowCameraRight: 30; shadowCameraTop: 30; shadowCameraBottom: -30"
              position="-8 15 6"></a-entity>

    <a-box id="player" color="#ff7043" shadow="cast: true; receive: false" player-move></a-box>

    <!--
      Caméra orbitale :
      - suit le joueur (lissage exponentiel, distance constante)
      - orbite au clic gauche, zoom à la molette avec bornes min/max
      - élévation bornée entre 5° (jamais sous le plan) et 89° (≤ 90°, jamais "derrière" le zénith)
      look-controls / wasd-controls désactivés : c'est orbit-follow qui pilote la caméra.
    -->
    <a-entity id="cam" camera look-controls="enabled: false" wasd-controls="enabled: false"
              orbit-follow="target: #player; distance: 9; minDistance: 3; maxDistance: 20;
                            minPolar: 5; maxPolar: 89; elevation: 25; damping: 10"></a-entity>
  </a-scene>

  <script>
    const stat = document.querySelector('#stat');
    setInterval(() => {
      const o = document.querySelector('#cam').components['orbit-follow'];
      if (!o) return;
      const deg = THREE.MathUtils.radToDeg;
      stat.textContent = `azimut ${deg(o.cur.theta).toFixed(0)}° · élévation ${deg(o.cur.phi).toFixed(0)}° · distance ${o.cur.r.toFixed(1)} m`;
    }, 100);
  </script>
</body>
</html>
